# Test the site, then (on main) build it (build_site.py) and publish it to GitHub
# Pages. Pull requests are tested too, so a new tune that breaks something shows up
# before it's merged. One-time setup: repo Settings -> Pages -> Source: GitHub Actions.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Every Monday morning too, so the sessions' next dates (in sesiynau/'s data for search
  # engines, worked out at build time) never go stale.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the history too: tune_numbers.json is checked against NUMBERS_BASE
      # uv installs the test dependencies in seconds, from a cache kept between runs.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt
      - run: uv pip install -r requirements-dev.txt
      # The browser for the tests (about 150 MB), kept between runs until Playwright is
      # upgraded. Its system libraries come from Ubuntu's package manager each time.
      - id: playwright
        run: echo "version=$(python -c "import importlib.metadata as m; print(m.version('playwright'))")" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - run: python -m pytest
        env:
          # tune_numbers.json must only add to what main had before this push (or, for a
          # pull request, to its base), however many commits it brings.
          NUMBERS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      # A failed browser test leaves a trace of what the page did: download it from the
      # run's summary page and open it at trace.playwright.dev.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
