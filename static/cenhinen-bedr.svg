<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Gŵyl Dewi: a daffodil (cenhinen Bedr), with its leaves, as worn on 1 March. -->
  <!-- stem and leaves -->
  <g fill="#2e6b4f" stroke="#1d3b25" stroke-width="0.8" stroke-linejoin="round">
    <path d="M30.5 62 C30 50 30.5 40 32 30 L34 30 C33 40 32.5 50 33.5 62 Z"/>
    <path d="M29 62 C24 52 20 44 14 38 C21 41 27 49 31 62 Z"/>
    <path d="M35 62 C38 50 43 42 50 36 C45 44 40 52 37 62 Z"/>
  </g>
  <!-- the sheath behind the flower -->
  <path d="M33 31 C35 27 37 25 40 24 C38 27 36 29 34 31 Z" fill="#c9b98a" stroke="#7a3e12" stroke-width="0.6"/>
