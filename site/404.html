<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Y Sesiwn</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages shows this for an address with no file. A tune's address
       (…/alaw/<folder>/) that has none, because the tune was renamed or removed, opens
       the app at ?tune=<folder>, which says so and suggests the nearest names; an address
       with something stuck to its end goes to the address without it. -->
  <script>
    // A link pasted with something stuck to its end (a space or non-breaking space, a
    // full stop or bracket: …/alaw/glandyfi/%C2%A0): go to the address without it.
    var path = location.pathname, clean;
    try { clean = decodeURIComponent(path); } catch (e) { clean = path; }
    clean = clean.replace(/[\s\u00a0\u200b.,;:!?'"\u2019\u201d)\]>]+$/, "");
    if (clean !== decodeURIComponentSafe(path)) location.replace(encodeURI(clean) + location.search);
    else {
      var m = path.match(/^(.*\/)alaw\/([^/]+)\/?$/);
      if (m) location.replace(m[1] + "?tune=" + m[2]);
    }
    function decodeURIComponentSafe(p) { try { return decodeURIComponent(p); } catch (e) { return p; } }
  </script>
  <style>
    :root { color-scheme: light dark; }
    html { background: Canvas url("/carthen.svg") repeat-x left top / auto 14px; }
    body { font: 1.1rem/1.5 system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; color: CanvasText; }
    .art::after { content: ""; display: block; width: 6rem; height: 7px; margin-top: .5rem;
      background: url("/carthen.svg") repeat-x left center / auto 7px; }
    a { color: LinkText; }
  </style>
</head>
<body>
  <main>
    <div class="art" aria-hidden="true"><img src="/static/harp.svg" alt="" width="72" height="72"></div>
    <h1>Page not found · <span lang="cy">Tudalen heb ei chanfod</span></h1>
    <p>There's nothing at this address. · <span lang="cy">Does dim byd yn y cyfeiriad hwn.</span></p>
    <p><a href="/">Y Sesiwn: Welsh folk tunes · <span lang="cy">alawon gwerin Cymru</span></a></p>
    <p><a href="/?page=browse">Browse every tune · <span lang="cy">Pori pob alaw</span></a></p>
  </main>
</body>
</html>
