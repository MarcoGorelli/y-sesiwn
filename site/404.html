<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Y Sesiwn</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages shows this for an address with no file. A tune's address
       (…/alaw/<folder>/) that has none, because the tune was renamed or removed, opens
       the app at ?tune=<folder>, which says so and suggests the nearest names; a session's
       that has none (…/sesiynau/<id>/) opens the sessions page, and a night's at one
       (…/sesiynau/<id>/<date>/) the session's; an address
       with something stuck to its end goes to the address without it. A tune's, a type's
       or an embedded tune's written with capitals, accents or punctuation (alaw/Glandyfi/,
       math/rîl/) goes to the folder build_site.py makes of it, and a version's folder for
       another website (embed/glandyfi-version-3/) to the tune's, at that version. The
       address's query (?key=A&tempo=80) and #… go along. -->
  <script>
    // A link pasted with something stuck to its end (a space or non-breaking space, a
    // full stop or bracket: …/alaw/glandyfi/%C2%A0): go to the address without it.
    var path = location.pathname, clean = decodeURIComponentSafe(path), rest = location.search + location.hash;
    clean = clean.replace(/[\s\u00a0\u200b.,;:!?'"\u2019\u201d)\]>]+$/, "");
    if (clean !== decodeURIComponentSafe(path)) location.replace(encodeURI(clean) + rest);
    else {
      var m = clean.match(/^(.*\/)(alaw|math|embed)\/([^/]+)\/?$/), folder = m && slugify(m[3]), version;
      if (m && folder && folder !== m[3]) location.replace(encodeURI(m[1] + m[2] + "/" + folder + "/") + rest);
      else if (m && m[2] === "alaw") location.replace(encodeURI(m[1]) + "?tune=" + encodeURIComponent(m[3])
        + location.search.replace(/^\?/, "&") + location.hash);
      else if (m && m[2] === "embed" && (version = m[3].match(/^(.+)-version-(\d+)$/))) {
        var query = new URLSearchParams(location.search);
        query.set("v", version[2]);
        location.replace(encodeURI(m[1] + "embed/" + version[1] + "/") + "?" + query + location.hash);
      }
      // A session that has stopped, or moved to another day (a new address): all of them.
      // A night with no tunes sent in: its session.
      var s = path.match(/^(.*\/)sesiynau\/[^/]+\/?$/), night = path.match(/^(.*\/sesiynau\/[^/]+\/)\d{4}-\d{2}-\d{2}\/?$/);
      if (s) location.replace(s[1] + "sesiynau/");
      else if (night) location.replace(night[1]);
    }
    function decodeURIComponentSafe(p) { try { return decodeURIComponent(p); } catch (e) { return p; } }
    // build_site.py's slugify (app.js: typeSlug): "Codi'r Hwyl" -> "codi-r-hwyl".
    function slugify(name) {
      return name.normalize("NFKD").replace(/\p{M}/gu, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }
  </script>
  <style>
    :root { color-scheme: light dark; }
    html { background: Canvas url("/carthen.svg") repeat-x left top / auto 14px; }
    body { font: 1.1rem/1.5 system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; color: CanvasText; }
    .art::after { content: ""; display: block; width: 6rem; height: 7px; margin-top: .5rem;
      background: url("/carthen.svg") repeat-x left center / auto 7px; }
    a { color: LinkText; }
  </style>
</head>
<body>
  <main>
    <div class="art" aria-hidden="true"><img src="/static/harp.svg" alt="" width="72" height="72"></div>
    <h1>Page not found · <span lang="cy">Tudalen heb ei chanfod</span></h1>
    <p>There's nothing at this address. · <span lang="cy">Does dim byd yn y cyfeiriad hwn.</span></p>
    <p><a href="/">Y Sesiwn: Welsh folk tunes · <span lang="cy">alawon gwerin Cymru</span></a></p>
    <p><a href="/?page=browse">Browse every tune · <span lang="cy">Pori pob alaw</span></a></p>
  </main>
  <script>
    // In someone else's website (an embedded tune's address that has none): the site opens
    // in a tab of its own, not inside their page.
    if (window.top !== window) for (var i = 0; i < document.links.length; i++) {
      document.links[i].target = "_blank";
      document.links[i].rel = "noopener";
    }
  </script>
</body>
</html>
