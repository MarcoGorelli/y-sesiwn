<!doctype html><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .card {
    width: 1200px; height: 630px; box-sizing: border-box; position: relative; overflow: hidden;
    background: #fbf6ea; font-family: "DejaVu Sans", system-ui, sans-serif; color: #262b31;
    display: flex; align-items: center; gap: 44px; padding: 0 56px;
  }
  .band { position: absolute; left: 0; right: 0; height: 42px; background: url(../site/carthen.svg) repeat-x left / auto 42px; }
  .top { top: 0; } .bottom { bottom: 0; }
  /* the harp, crwth and pibgorn on a scrap of Welsh quilt, as on the home page */
  .instruments {
    flex: none; display: flex; align-items: flex-end; justify-content: center;
    width: 440px; height: 249px; box-sizing: border-box; padding: 0 38px 38px;
    background: url(../static/quilt.svg) center / 100% 100% no-repeat;
  }
  .instruments img { width: 130px; height: 130px; }
  h1 { margin: 0; white-space: nowrap; font-size: 104px; line-height: 1; color: #C8102E; letter-spacing: -2px; }
  .rule { width: 100px; height: 7px; background: #C8102E; border-radius: 4px; margin: 22px 0 24px; }
  p { margin: 0; white-space: nowrap; font-size: 34px; line-height: 1.3; color: #3b4550; }
  .url { margin-top: 24px; font-size: 28px; color: #66707a; letter-spacing: 1px; }
</style>
<div class="card">
  <div class="band top"></div>
  <div class="instruments">
    <img src="../static/harp.svg" alt=""><img src="../static/crwth.svg" alt=""><img src="../static/pibgorn.svg" alt="">
  </div>
  <div>
    <h1>Y Sesiwn</h1>
    <div class="rule"></div>
    <p>Welsh folk tunes: sheet music,<br>playback, and any key</p>
    <div class="url">ysesiwn.cymru</div>
  </div>
  <div class="band bottom"></div>
</div>
