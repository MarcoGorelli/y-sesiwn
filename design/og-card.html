<!doctype html><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .card {
    width: 1200px; height: 630px; box-sizing: border-box; position: relative; overflow: hidden;
    background: #fbf6ea; font-family: "DejaVu Sans", system-ui, sans-serif; color: #262b31;
    display: flex; align-items: center; gap: 56px; padding: 0 96px;
  }
  .band { position: absolute; left: 0; right: 0; height: 42px; background: url(../site/carthen.svg) repeat-x left / auto 42px; }
  .top { top: 0; } .bottom { bottom: 0; }
  img { width: 250px; height: 250px; flex: none; }
  h1 { margin: 0; font-size: 124px; line-height: 1; color: #C8102E; letter-spacing: -2px; }
  .rule { width: 110px; height: 7px; background: #C8102E; border-radius: 4px; margin: 26px 0 28px; }
  p { margin: 0; font-size: 40px; line-height: 1.3; color: #3b4550; }
  .url { margin-top: 26px; font-size: 30px; color: #66707a; letter-spacing: 1px; }
</style>
<div class="card">
  <div class="band top"></div>
  <img src="../static/harp.svg" alt="">
  <div>
    <h1>Y Sesiwn</h1>
    <div class="rule"></div>
    <p>Welsh folk tunes: sheet music,<br>playback, and any key</p>
    <div class="url">ysesiwn.cymru</div>
  </div>
  <div class="band bottom"></div>
</div>
