# A pull request each month for newer GitHub Actions (pages.yml) and test tools
# (requirements-dev.txt), with the tests run on it: merge it if they pass. The vendored
# libraries in static/ are checked by updates.yml instead, which Dependabot can't see.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      test-tools:
        patterns: ["*"]
    ignore:
      # Must match the dev container's image (.devcontainer/Dockerfile), so it's bumped
      # by hand with it: updates.yml says when there's a new one.
      - dependency-name: playwright
