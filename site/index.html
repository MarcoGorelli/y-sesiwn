<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Y Sesiwn</title>
  <meta name="description" content="A free, open-source resource to help you learn and share Welsh folk tunes: sheet music, playback and any key.">
  <link rel="icon" href="static/harp.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/abcjs/abcjs-audio.css">
  <link rel="stylesheet" href="style.css">
  <script src="static/abcjs/abcjs-basic-min.js" defer></script>
  <script src="static/marked/marked.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Left column on wide screens; on phones .topbar sticks to the top of the page. -->
  <div class="nav">
    <header class="topbar">
      <a class="brand" href="./" data-route><img src="static/harp.svg" alt="" width="36" height="36">Y Sesiwn</a>
      <div class="search">
        <label for="search-input" class="visually-hidden">Find a tune</label>
        <input id="search-input" type="search" autocomplete="off" spellcheck="false"
               placeholder="Find a tune…"
               role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list">
        <kbd class="shortcut" title="Press / to search">/</kbd>
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </div>
    </header>
    <aside class="sidebar">
      <div class="sidebar-actions">
        <button type="button" id="home-button">Back to home</button>
        <button type="button" id="surprise-sidebar">Surprise me</button>
      </div>
      <nav class="sidebar-links">
        <a href="?page=add" data-route>How to add a tune</a>
        <a href="?page=fix" data-route>How to submit corrections</a>
        <a href="?page=about" data-route>About Y Sesiwn</a>
        <a href="https://github.com/MarcoGorelli/y-sesiwn">GitHub</a>
      </nav>
    </aside>
  </div>
  <main id="main"><p class="loading">Loading tunes…</p></main>
  <footer class="site-footer">
    <p>
      <strong>Y Sesiwn</strong> · free and open source ·
      <a href="?page=about" data-route>About</a> ·
      <a href="?page=add" data-route>Add a tune</a> ·
      <a href="https://github.com/MarcoGorelli/y-sesiwn">GitHub</a>
    </p>
  </footer>
</body>
</html>
