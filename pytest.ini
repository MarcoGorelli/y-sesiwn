[pytest]
testpaths = tests
# In parallel (pytest-xdist), a worker for each processor: -n0 for one at a time. Workers
# take tests from each other when they run out, so a few slow ones don't hold up the end.
addopts = -n auto --dist worksteal
markers =
    browser: runs the site in a headless browser (Playwright)
    alone: times sound in real time, so runs while no other test does (see conftest.py)
