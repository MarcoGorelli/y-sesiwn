<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 0 64 64">
  <!-- A Welsh triple harp (telyn deires). Made by design/triple-harp.py. -->
  <g stroke-width="0.8" stroke-linecap="round">
    <line x1="26.30" y1="28.30" x2="26.30" y2="28.70" stroke="#c9a227"/>
    <line x1="28.15" y1="28.08" x2="28.15" y2="31.78" stroke="#c8102e"/>
    <line x1="30.00" y1="27.45" x2="30.00" y2="34.87" stroke="#c9a227"/>
    <line x1="31.85" y1="26.40" x2="31.85" y2="37.95" stroke="#c9a227"/>
    <line x1="33.70" y1="24.93" x2="33.70" y2="41.03" stroke="#c8102e"/>
    <line x1="35.55" y1="23.06" x2="35.55" y2="44.12" stroke="#c9a227"/>
    <line x1="37.40" y1="20.72" x2="37.40" y2="47.20" stroke="#c9a227"/>
    <line x1="39.25" y1="17.96" x2="39.25" y2="50.28" stroke="#c8102e"/>
    <line x1="41.10" y1="14.59" x2="41.10" y2="53.37" stroke="#c9a227"/>
  </g>
  <g fill="none" stroke="#7a3e12" stroke-linecap="round" stroke-linejoin="round">
    <!-- neck, climbing to the top of the pillar -->
    <path d="M21.5 25 C 29 29.5, 37 23, 43.5 7.5" stroke-width="3"/>
    <!-- pillar, with a scroll on top curling back over the strings -->
    <path d="M45 58 V7 C 45 3.2, 40.6 2.6, 40.2 5.2 C 39.9 7, 42 7.8, 42.8 6.3" stroke-width="3.2"/>
  </g>
  <!-- finial where the neck meets the soundbox -->
  <circle cx="21" cy="23.6" r="1.9" fill="#7a3e12"/>
  <!-- soundbox: short, widening to the foot -->
  <path d="M20 25 L25 26 L43 56 L43 58 L29 58 Z" fill="#7a3e12" stroke="#7a3e12" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- plinth -->
  <rect x="27" y="58" width="21.5" height="3" rx="0.8" fill="#5c2d0c"/>
</svg>
