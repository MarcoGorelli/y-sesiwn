[server]
# Serve ./static (abcjs and the piano soundfont) at /app/static/ so the app
# works offline. Populate it with: .venv/bin/python download_assets.py
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
# Welsh flag red, for accents only (primary buttons, selected pills, slider,
# focused inputs). Links and everything else keep Streamlit's defaults.
primaryColor = "#C8102E"
