<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A crwth, after the 18th-century ones at the National Library of Wales and Warrington:
       a box body and inverted-U yoke in one piece, with an opening each side of the
       fingerboard; six strings, four bowed over the fingerboard and two drones beside it
       (plucked with the thumb); wrest pins in the yoke; two round soundholes; and a
       slanting bridge, one foot of which goes through a soundhole to the back. -->
  <!-- body and yoke, with the two openings cut out -->
  <path fill="#7a3e12" fill-rule="evenodd" d="M23 3 H41 Q44 3 44 6 V58 Q44 61 41 61 H23 Q20 61 20 58 V6 Q20 3 23 3 Z
    M23.5 7.5 H28.5 V25 H23.5 Z M35.5 7.5 H40.5 V25 H35.5 Z"/>
  <!-- soundboard -->
  <rect x="22" y="27" width="20" height="32" rx="1.5" fill="#9a5a25"/>
  <!-- fingerboard -->
  <rect x="29.5" y="6" width="5" height="32" rx="0.6" fill="#5c2d0c"/>
  <!-- soundholes -->
  <circle cx="26" cy="45" r="1.7" fill="#2a1606"/>
  <circle cx="38" cy="45" r="1.7" fill="#2a1606"/>
  <!-- tailpiece -->
  <path d="M28.5 52 H35.5 L34.8 57.5 H29.2 Z" fill="#5c2d0c"/>
  <!-- strings: two drones (red) beside the fingerboard, four bowed (gold) over it -->
  <g stroke-width="0.6" stroke-linecap="round">
    <line x1="25.4" y1="5" x2="29.2" y2="52.5" stroke="#c8102e"/>
    <line x1="26.8" y1="5" x2="29.9" y2="52.5" stroke="#c8102e"/>
    <line x1="30.4" y1="5" x2="30.8" y2="52.5" stroke="#c9a227"/>
    <line x1="31.5" y1="5" x2="31.7" y2="52.5" stroke="#c9a227"/>
    <line x1="32.5" y1="5" x2="32.3" y2="52.5" stroke="#c9a227"/>
    <line x1="33.6" y1="5" x2="33.2" y2="52.5" stroke="#c9a227"/>
  </g>
  <!-- wrest pins -->
  <g fill="#c9a227">
    <circle cx="25.4" cy="5" r="0.6"/><circle cx="26.8" cy="5" r="0.6"/>
    <circle cx="30.4" cy="5" r="0.6"/><circle cx="31.5" cy="5" r="0.6"/>
    <circle cx="32.5" cy="5" r="0.6"/><circle cx="33.6" cy="5" r="0.6"/>
  </g>
  <!-- bridge, set at a slant -->
  <line x1="27" y1="46.6" x2="37" y2="44.2" stroke="#2a1606" stroke-width="1.3" stroke-linecap="round"/>
</svg>
