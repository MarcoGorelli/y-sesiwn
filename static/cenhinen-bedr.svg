  <g fill="#f6d34a" stroke="#a37a10" stroke-width="0.8" stroke-linejoin="round">
    <path d="M32 20 C28 12 30 6 32 3 C34 6 36 12 32 20 Z"/>
    <path d="M32 20 C24 19 20 23 18 26 C22 27.5 28 26 32 20 Z"/>
    <path d="M32 20 C40 19 44 23 46 26 C42 27.5 36 26 32 20 Z"/>
    <path d="M32 20 C25 15 19 12 15 13 C17 17 24 21 32 20 Z"/>
    <path d="M32 20 C39 15 45 12 49 13 C47 17 40 21 32 20 Z"/>
    <path d="M32 20 C29 27 30 32 32 34 C34 32 35 27 32 20 Z"/>
  </g>
  <!-- the trumpet, facing out -->
  <circle cx="32" cy="20" r="7.2" fill="#e9a800" stroke="#a35a10" stroke-width="0.9"/>
  <path d="M25.6 18.2 L27 19.4 L26.6 21.4 L28.2 22.6 L28.4 24.6 L30.4 25.2 L32 26.8 L33.6 25.2 L35.6 24.6 L35.8 22.6 L37.4 21.4 L37 19.4 L38.4 18.2"
        fill="none" stroke="#a35a10" stroke-width="0.7" stroke-linejoin="round"/>
  <circle cx="32" cy="20" r="4" fill="#d48a00"/>
  <circle cx="32" cy="20" r="1.4" fill="#a35a10"/>
</svg>
